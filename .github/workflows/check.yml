name: check

permissions:
  contents: read

on:
  push:
    branches:
      - 'main'
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  workflow_dispatch:

# Cancel superseded pull-request runs instead of letting them finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-php:
    name: Test on php ${{ matrix.php-version }} and ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.2", "8.3", "8.4", "8.5"]
        experimental: [false]
        # Windows and macOS carry a large share of the path-handling code
        # (drive letters, separator normalization, case-insensitive and
        # normalization-insensitive volumes, tempnam() prefix truncation),
        # so they have to be exercised on a real host.
        os: [ubuntu-latest, windows-latest, macos-latest]
        coverage-extension: [pcov]
        include:
          # pcov cannot produce branch/path coverage; one xdebug job supplies
          # it for the report uploaded to Codecov.
          - php-version: "8.4"
            experimental: false
            os: ubuntu-latest
            coverage-extension: xdebug
    steps:
      - uses: actions/checkout@v7
      - name: Use php ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: ${{ matrix.coverage-extension }}
          extensions: bcmath, curl, date, gd, hash, imagick, intl, json, mbstring, openssl, pcre, zlib
          ini-values: display_errors=on, error_reporting=-1, zend.assertions=1
      - name: List php modules
        run: php -m
      - name: List php modules using "no php ini" mode
        run: php -m -n
      - name: Cache module
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/
          key: composer-cache-${{ matrix.os }}
      - name: Install dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: composer install --no-interaction --no-progress
      # mago ships a per-platform binary; keep the style and analysis gate on a
      # single runner rather than on every matrix entry.
      - name: Check code style
        if: matrix.os == 'ubuntu-latest' && matrix.coverage-extension == 'pcov'
        run: composer run cs-check
      - name: Analyse
        if: matrix.os == 'ubuntu-latest' && matrix.coverage-extension == 'pcov'
        run: composer run analyse
      # Path (branch) coverage is an Xdebug-only capability: requesting it in
      # phpunit.xml.dist would abort the pcov jobs, which have no driver able
      # to collect it. Ask for it here only, where Xdebug is installed.
      - name: Run all tests
        if: matrix.coverage-extension != 'xdebug'
        run: composer run test
      - name: Run all tests with path coverage
        if: matrix.coverage-extension == 'xdebug'
        run: composer run test -- --path-coverage
      - name: Send coverage
        if: matrix.coverage-extension == 'xdebug'
        uses: codecov/codecov-action@v7
        with:
          flags: php-${{ matrix.php-version }}-${{ matrix.os }}
          name: php-${{ matrix.php-version }}-${{ matrix.os }}
